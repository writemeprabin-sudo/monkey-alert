<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monkey Alert</title>
<meta name="theme-color" content="#d62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monkey Alert">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%92%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touch-icon" href="">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --red:#d62828; --blue:#1e64c8; --ink:#222; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; }
  .top { position:absolute; z-index:1000; top:calc(env(safe-area-inset-top) + 10px); left:10px; right:10px; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .chips { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.96); border-radius:24px; padding:6px 10px; box-shadow:0 2px 8px rgba(0,0,0,.2); flex-wrap:wrap; }
  .chips label { font-size:12px; color:#444; }
  .chip { border:0; background:#eee; border-radius:16px; padding:7px 11px; font-size:13px; color:#222; }
  .chip.on { background:var(--blue); color:#fff; font-weight:600; }
  .note { align-self:flex-start; background:#fff3cd; color:#664d03; font-size:12px; padding:4px 10px; border-radius:10px; }
  .alertbar { background:var(--red); color:#fff; padding:12px 14px; border-radius:14px; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.35); animation:pulse 1s 3; }
  @keyframes pulse { 50% { transform:scale(1.03); } }
  .hidden { display:none !important; }
  .fab { position:absolute; z-index:1000; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 28px); background:var(--red); color:#fff; border:0; border-radius:32px; padding:16px 28px; font-size:17px; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.3); white-space:nowrap; }
  .locate { position:absolute; z-index:1000; right:12px; bottom:calc(env(safe-area-inset-bottom) + 100px); width:46px; height:46px; border-radius:50%; border:0; background:#fff; font-size:22px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .card { position:absolute; z-index:1000; left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom) + 20px); background:#fff; border-radius:18px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,.3); }
  .card h3 { margin:0; font-size:18px; }
  .card p { margin:2px 0 12px; color:#555; font-size:14px; }
  .row { display:flex; gap:8px; }
  .btn { flex:1; border:0; border-radius:12px; padding:13px 8px; font-size:14px; font-weight:600; }
  .dark { background:#222; color:#fff; } .light { background:#eee; color:#222; }
  .toast { position:absolute; z-index:2000; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 120px); background:#222; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; max-width:90%; text-align:center; }
  .backdrop { position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; }
  .sheet { background:#fff; width:100%; border-radius:24px 24px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet h2 { margin:0 0 12px; font-size:20px; }
  .seg { display:flex; gap:6px; margin-bottom:14px; }
  .seg .chip { flex:1; padding:11px 6px; }
  .size { display:block; width:100%; text-align:left; border:2px solid #eee; background:#fff; border-radius:14px; padding:15px; margin-bottom:10px; font-size:16px; font-weight:600; }
  .size:active { background:#ffe3e3; border-color:var(--red); }
  .cancel { width:100%; border:0; background:none; padding:12px; font-size:15px; font-weight:600; }
  .pin { font-size:28px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); text-align:center; }
  .leaflet-container { font-family:inherit; }
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="chips">
    <label id="lbl-radius"></label>
    <button class="chip" data-r="1">1 km</button>
    <button class="chip" data-r="2">2 km</button>
    <button class="chip" data-r="5">5 km</button>
    <button class="chip" id="btn-lang">नेपाली</button>
  </div>
  <div class="note hidden" id="note-demo"></div>
  <div class="note hidden" id="note-queue"></div>
  <div class="alertbar hidden" id="alertbar"></div>
</div>

<button class="locate" id="btn-locate" aria-label="My location">📍</button>
<button class="fab" id="btn-report"></button>

<div class="card hidden" id="card">
  <h3 id="card-title"></h3>
  <p id="card-sub"></p>
  <div class="row">
    <button class="btn dark" id="btn-confirm"></button>
    <button class="btn light" id="btn-gone"></button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<div class="backdrop hidden" id="sheet-bg">
  <div class="sheet">
    <h2 id="sheet-title"></h2>
    <div class="seg">
      <button class="chip on" data-where="me" id="w-me"></button>
      <button class="chip" data-where="center" id="w-center"></button>
    </div>
    <button class="size" data-size="few" id="s-few"></button>
    <button class="size" data-size="group" id="s-group"></button>
    <button class="size" data-size="troop" id="s-troop"></button>
    <button class="cancel" id="btn-cancel"></button>
  </div>
</div>

<script>
/* ========= SETTINGS: paste your Supabase details here (see README). Leave empty for demo mode. ========= */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_KEY: '',
  START_VIEW: { lat: 28.39, lng: 84.12, zoom: 7 }   // shown until GPS is found (Nepal)
};
/* ===================================================================================================== */

const ACTIVE_H = 6, GONE_LIMIT = 3, POLL_MS = 20000;
const REMOTE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const CIRCLE_M = { few: 100, group: 200, troop: 350 };

/* ---------- tiny storage helpers ---------- */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ---------- language ---------- */
const STR = {
  en: {
    report:'🐒  Report monkeys', title:'How many monkeys?', atMe:'At my location', atCenter:'At map center',
    few:'1–3 monkeys', group:'A group (4–15)', troop:'Big troop (15+)', cancel:'Cancel',
    confirm:'Still here', gone:'They left', radius:'Alert radius',
    alertTitle:'🐒 Monkeys nearby!', alertBody:km=>`Monkeys reported ${km} km from you. Protect your crops.`,
    ago:(v,u)=>u==='m'?`${v} min ago`:`${v} hr ago`, confirmedBy:n=>`${n} confirmed`,
    queued:n=>`${n} report(s) waiting for signal`, sent:'Report sent. Thank you!',
    offline:'No signal. Report saved and will send automatically.', noLoc:'Location unavailable. Use "At map center" or turn on GPS.',
    demo:'Demo mode: reports stay on this phone only', voted:'Thanks, vote saved.', already:'You already voted on this one.',
    size:{few:'1–3 monkeys', group:'Group of monkeys', troop:'Big troop'}, lang:'नेपाली'
  },
  ne: {
    report:'🐒  बाँदर रिपोर्ट गर्नुहोस्', title:'कति वटा बाँदर?', atMe:'मेरो स्थानमा', atCenter:'नक्साको बीचमा',
    few:'१–३ बाँदर', group:'समूह (४–१५)', troop:'ठूलो हूल (१५+)', cancel:'रद्द गर्नुहोस्',
    confirm:'अझै यहीँ छन्', gone:'गए', radius:'सूचना दायरा',
    alertTitle:'🐒 नजिकै बाँदर!', alertBody:km=>`तपाईंबाट ${km} किमी टाढा बाँदर देखियो। बाली जोगाउनुहोस्।`,
    ago:(v,u)=>u==='m'?`${v} मिनेट अघि`:`${v} घण्टा अघि`, confirmedBy:n=>`${n} जनाले पुष्टि गरे`,
    queued:n=>`${n} रिपोर्ट नेटवर्कको पर्खाइमा`, sent:'रिपोर्ट पठाइयो। धन्यवाद!',
    offline:'नेटवर्क छैन। रिपोर्ट सुरक्षित भयो, आफैं पठाइनेछ।', noLoc:'स्थान उपलब्ध छैन। "नक्साको बीचमा" प्रयोग गर्नुहोस् वा GPS खोल्नुहोस्।',
    demo:'डेमो मोड: रिपोर्ट यही फोनमा मात्र रहन्छ', voted:'धन्यवाद, भोट सुरक्षित भयो।', already:'तपाईंले पहिले नै भोट गरिसक्नुभयो।',
    size:{few:'१–३ बाँदर', group:'बाँदरको समूह', troop:'ठूलो हूल'}, lang:'EN'
  }
};
let lang = load('lang', 'en');
let radiusKm = load('radius', 2);
const T = () => STR[lang];

/* ---------- ids ---------- */
let deviceId = load('device_id', null);
if (!deviceId) { deviceId = 'd-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); save('device_id', deviceId); }

/* ---------- data layer (Supabase REST, or local demo mode) ---------- */
async function rest(path, opts = {}) {
  const K = CONFIG.SUPABASE_KEY;
  const headers = { apikey: K, 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (K.startsWith('eyJ')) headers.Authorization = 'Bearer ' + K;
  const r = await fetch(CONFIG.SUPABASE_URL + '/rest/v1/' + path, { ...opts, headers });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
const sinceIso = () => new Date(Date.now() - ACTIVE_H * 3600e3).toISOString();

async function fetchSightings() {
  if (REMOTE) {
    return rest(`sightings?select=*&created_at=gte.${encodeURIComponent(sinceIso())}&gone_votes=lt.${GONE_LIMIT}&order=created_at.desc&limit=500`);
  }
  const s = sinceIso();
  return load('local_sightings', []).filter(x => x.created_at >= s && x.gone_votes < GONE_LIMIT);
}
async function createSighting(n) {
  if (REMOTE) {
    const res = await rest('sightings', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify(n) });
    return res[0];
  }
  const item = { id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), confirms: 0, gone_votes: 0, created_at: new Date().toISOString(), ...n };
  save('local_sightings', [item, ...load('local_sightings', [])]);
  return item;
}
async function sendVote(id, kind) {
  if (REMOTE) {
    await rest('rpc/vote_sighting', { method: 'POST', body: JSON.stringify({ p_sighting: id, p_device: deviceId, p_kind: kind }) });
    return;
  }
  save('local_sightings', load('local_sightings', []).map(s => s.id === id
    ? { ...s, confirms: s.confirms + (kind === 'confirm' ? 1 : 0), gone_votes: s.gone_votes + (kind === 'gone' ? 1 : 0) } : s));
}

/* ---------- offline queue ---------- */
const queueSize = () => load('queue', []).length;
async function flushQueue() {
  const items = load('queue', []);
  const left = [];
  for (const it of items) { try { await createSighting(it); } catch { left.push(it); } }
  save('queue', left);
  return left.length;
}

/* ---------- geo helpers ---------- */
function distKm(a, b) {
  const R = 6371, r = d => d * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const minsAgo = iso => Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
const ageColor = m => m < 30 ? '#d62828' : m < 120 ? '#f77f00' : '#e9c46a';
const ageText = m => m < 60 ? T().ago(m, 'm') : T().ago(Math.round(m / 60), 'h');

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false }).setView([CONFIG.START_VIEW.lat, CONFIG.START_VIEW.lng], CONFIG.START_VIEW.zoom);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
const layer = L.layerGroup().addTo(map);
let me = null, meDot = null, meRing = null, sightings = [], selected = null, seen = null;

function drawMe() {
  if (!me) return;
  if (!meDot) {
    meDot = L.circleMarker([me.lat, me.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#1e64c8', fillOpacity: 1 }).addTo(map);
    meRing = L.circle([me.lat, me.lng], { radius: radiusKm * 1000, color: '#1e64c8', weight: 1, fillOpacity: .05, interactive: false }).addTo(map);
  } else {
    meDot.setLatLng([me.lat, me.lng]);
    meRing.setLatLng([me.lat, me.lng]).setRadius(radiusKm * 1000);
  }
}
function drawSightings() {
  layer.clearLayers();
  for (const s of sightings) {
    const c = ageColor(minsAgo(s.created_at));
    L.circle([s.lat, s.lng], { radius: CIRCLE_M[s.group_size] || 150, color: c, fillColor: c, fillOpacity: .3, weight: 2, interactive: false }).addTo(layer);
    L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="pin">🐒</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) })
      .on('click', e => { L.DomEvent.stopPropagation(e); select(s); }).addTo(layer);
  }
}
map.on('click', () => select(null));

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function paint() {
  const s = T();
  document.documentElement.lang = lang === 'ne' ? 'ne' : 'en';
  $('lbl-radius').textContent = s.radius;
  $('btn-lang').textContent = s.lang;
  $('btn-report').textContent = s.report;
  $('sheet-title').textContent = s.title;
  $('w-me').textContent = s.atMe; $('w-center').textContent = s.atCenter;
  $('s-few').textContent = '🐒 ' + s.few; $('s-group').textContent = '🐒🐒 ' + s.group; $('s-troop').textContent = '🐒🐒🐒 ' + s.troop;
  $('btn-cancel').textContent = s.cancel;
  $('btn-confirm').textContent = s.confirm; $('btn-gone').textContent = s.gone;
  $('note-demo').textContent = s.demo; $('note-demo').classList.toggle('hidden', REMOTE);
  const q = queueSize();
  $('note-queue').textContent = s.queued(q); $('note-queue').classList.toggle('hidden', q === 0);
  document.querySelectorAll('[data-r]').forEach(b => b.classList.toggle('on', +b.dataset.r === radiusKm));
  if (selected) fillCard();
}
function fillCard() {
  const s = T();
  $('card-title').textContent = '🐒 ' + s.size[selected.group_size];
  $('card-sub').textContent = ageText(minsAgo(selected.created_at)) + (selected.confirms > 0 ? '  ·  ' + s.confirmedBy(selected.confirms) : '');
}
function select(s) {
  selected = s;
  $('card').classList.toggle('hidden', !s);
  $('btn-report').classList.toggle('hidden', !!s);
  if (s) fillCard();
}
let toastTimer;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
}

/* ---------- alerts (while the page is open) ---------- */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t0 => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t0 + .2);
      o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + .22);
    });
  } catch {}
}
function raiseAlert(km) {
  const s = T();
  const bar = $('alertbar');
  bar.textContent = s.alertTitle + '  ' + s.alertBody(km.toFixed(1));
  bar.classList.remove('hidden');
  setTimeout(() => bar.classList.add('hidden'), 20000);
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
  beep();
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(s.alertTitle, { body: s.alertBody(km.toFixed(1)) });
  } catch {}
}
$('alertbar').addEventListener('click', () => $('alertbar').classList.add('hidden'));

/* ---------- refresh loop ---------- */
async function refresh() {
  try {
    await flushQueue();
    const list = await fetchSightings();
    sightings = list;
    if (seen === null) {
      seen = new Set(list.map(x => x.id));
    } else {
      for (const it of list) {
        if (seen.has(it.id)) continue;
        seen.add(it.id);
        if (me && it.device_id !== deviceId) {
          const km = distKm(me, it);
          if (km <= radiusKm) raiseAlert(km);
        }
      }
    }
    if (selected) selected = list.find(x => x.id === selected.id) || null;
    if (!selected) select(null);
    drawSightings();
  } catch { /* offline: keep showing what we have */ }
  paint();
}

/* ---------- reporting ---------- */
let where = 'me';
function openSheet() {
  where = me ? 'me' : 'center';
  setWhere(where);
  $('sheet-bg').classList.remove('hidden');
}
function setWhere(w) {
  where = w;
  document.querySelectorAll('[data-where]').forEach(b => b.classList.toggle('on', b.dataset.where === w));
}
async function submitReport(size) {
  const c = map.getCenter();
  const pt = where === 'me' ? me : { lat: c.lat, lng: c.lng };
  if (!pt) { toast(T().noLoc); return; }
  $('sheet-bg').classList.add('hidden');
  const payload = { lat: +pt.lat.toFixed(5), lng: +pt.lng.toFixed(5), group_size: size, device_id: deviceId };
  try { await createSighting(payload); toast(T().sent); }
  catch { save('queue', [...load('queue', []), { ...payload, created_at: new Date().toISOString() }]); toast(T().offline); }
  refresh();
}
async function castVote(kind) {
  if (!selected) return;
  const voted = load('voted', {});
  if (voted[selected.id]) { toast(T().already); return; }
  try { await sendVote(selected.id, kind); voted[selected.id] = kind; save('voted', voted); toast(T().voted); }
  catch { toast(T().offline); }
  select(null);
  refresh();
}

/* ---------- events ---------- */
$('btn-report').onclick = openSheet;
$('btn-cancel').onclick = () => $('sheet-bg').classList.add('hidden');
$('sheet-bg').addEventListener('click', e => { if (e.target.id === 'sheet-bg') $('sheet-bg').classList.add('hidden'); });
document.querySelectorAll('[data-where]').forEach(b => b.onclick = () => setWhere(b.dataset.where));
document.querySelectorAll('.size').forEach(b => b.onclick = () => submitReport(b.dataset.size));
$('btn-confirm').onclick = () => castVote('confirm');
$('btn-gone').onclick = () => castVote('gone');
$('btn-lang').onclick = () => { lang = lang === 'en' ? 'ne' : 'en'; save('lang', lang); paint(); };
document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { radiusKm = +b.dataset.r; save('radius', radiusKm); drawMe(); paint(); });
$('btn-locate').onclick = () => { if (me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 14)); else startGps(true); };
window.addEventListener('online', refresh);

/* ---------- GPS ---------- */
let gpsStarted = false;
function startGps(userTriggered) {
  if (!navigator.geolocation) { if (userTriggered) toast(T().noLoc); return; }
  if (gpsStarted && !userTriggered) return;
  gpsStarted = true;
  let first = true;
  navigator.geolocation.watchPosition(pos => {
    me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    drawMe();
    if (first) { first = false; map.setView([me.lat, me.lng], 14); }
  }, () => { if (userTriggered) toast(T().noLoc); }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
}

/* ---------- home-screen icon ---------- */
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d'); g.fillStyle = '#d62828'; g.fillRect(0, 0, 180, 180);
  g.font = '110px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('🐒', 90, 98);
  $('touch-icon').href = c.toDataURL('image/png');
} catch {}

/* ---------- go ---------- */
paint();
startGps(false);
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
